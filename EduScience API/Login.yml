info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "usuario": "admin",
        "senha": "123456"
      }
  auth: inherit

script:post-response: |-
  const body = res.getBody();
  if (body?.token) {
    bru.setVar("token", body.token);
  }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5