<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro da Escola | EduScience</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/validacoes.css">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <header class="navbar">
    <div class="logo">
      <h1>EduScience</h1>
    </div>
    <nav aria-label="Navegação principal">
      <a href="landing.html">Início</a>
      <a href="carrinho.html">Carrinho</a>
      <a href="login.html" class="btn-login">Entrar</a>
    </nav>
  </header>

  <main id="main-content" class="auth-page">
    <section class="auth-card" aria-labelledby="cadastro-title">
      <h2 id="cadastro-title">Cadastro Institucional</h2>
      <p class="auth-subtitle">Registre sua escola para adquirir kits didáticos e emitir NF-e.</p>

      <div id="feedback-alert" class="alert" role="alert" aria-live="polite"></div>

      <form id="cadastro-form" data-validar-submit novalidate>
        <fieldset class="form-section">
          <legend>1. Dados da Escola</legend>

          <div class="form-group">
            <label for="nome_escola">Nome da Escola / Instituição *</label>
            <input type="text" id="nome_escola" name="nome_escola" maxlength="150"
                   placeholder="Ex: Colégio Estadual Machado de Assis" autocomplete="organization"
                   required aria-required="true" data-validate="nome">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cnpj_cpf">CNPJ ou CPF *</label>
              <input type="text" id="cnpj_cpf" name="cnpj_cpf" maxlength="18"
                     inputmode="numeric" placeholder="00.000.000/0000-00"
                     required aria-required="true" data-mask="cnpj_cpf" data-validate="cnpj_cpf">
            </div>

            <div class="form-group">
              <label for="telefone">Telefone *</label>
              <input type="tel" id="telefone" name="telefone" maxlength="20"
                     inputmode="tel" placeholder="(11) 99999-9999" autocomplete="tel"
                     required aria-required="true" data-mask="telefone" data-validate="telefone">
            </div>
          </div>

          <div class="form-group">
            <label for="email">E-mail Institucional *</label>
            <input type="email" id="email" name="email" maxlength="100"
                   placeholder="contato@escola.edu.br" autocomplete="email"
                   required aria-required="true" data-validate="email">
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend>2. Endereço de Entrega e Faturamento</legend>

          <div class="form-row">
            <div class="form-group">
              <label for="cep">CEP *</label>
              <input type="text" id="cep" name="cep" maxlength="9"
                     inputmode="numeric" placeholder="00000-000" autocomplete="postal-code"
                     required aria-required="true" data-mask="cep" data-validate="cep">
            </div>

            <div class="form-group">
              <label for="estado">Estado (UF) *</label>
              <select id="estado" name="estado" autocomplete="address-level1" required aria-required="true">
                <option value="">Selecione...</option>
                <option value="AC">AC</option><option value="AL">AL</option>
                <option value="AP">AP</option><option value="AM">AM</option>
                <option value="BA">BA</option><option value="CE">CE</option>
                <option value="DF">DF</option><option value="ES">ES</option>
                <option value="GO">GO</option><option value="MA">MA</option>
                <option value="MT">MT</option><option value="MS">MS</option>
                <option value="MG">MG</option><option value="PA">PA</option>
                <option value="PB">PB</option><option value="PR">PR</option>
                <option value="PE">PE</option><option value="PI">PI</option>
                <option value="RJ">RJ</option><option value="RN">RN</option>
                <option value="RS">RS</option><option value="RO">RO</option>
                <option value="RR">RR</option><option value="SC">SC</option>
                <option value="SP">SP</option><option value="SE">SE</option>
                <option value="TO">TO</option>
              </select>
            </div>
          </div>

          <div class="form-row form-row-address">
            <div class="form-group">
              <label for="logradouro">Logradouro *</label>
              <input type="text" id="logradouro" name="logradouro" maxlength="255"
                     placeholder="Rua, Avenida, Praça..." autocomplete="street-address"
                     required aria-required="true">
            </div>

            <div class="form-group">
              <label for="numero">Número *</label>
              <input type="text" id="numero" name="numero" maxlength="10"
                     placeholder="123" required aria-required="true">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="bairro">Bairro *</label>
              <input type="text" id="bairro" name="bairro" maxlength="100"
                     placeholder="Centro" autocomplete="address-level3"
                     required aria-required="true">
            </div>

            <div class="form-group">
              <label for="cidade">Cidade *</label>
              <input type="text" id="cidade" name="cidade" maxlength="100"
                     placeholder="São Paulo" autocomplete="address-level2"
                     required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" maxlength="100"
                   placeholder="Bloco, Sala, Portaria (opcional)">
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend>3. Dados de Acesso</legend>

          <div class="form-group">
            <label for="usuario">Usuário *</label>
            <input type="text" id="usuario" name="usuario" maxlength="50"
                   placeholder="Ex: escola.machado" autocomplete="username"
                   required aria-required="true" data-validate="usuario">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="senha">Senha *</label>
              <input type="password" id="senha" name="senha" minlength="6"
                     placeholder="Mínimo 6 caracteres" autocomplete="new-password"
                     required aria-required="true" data-validate="senha">
            </div>

            <div class="form-group">
              <label for="confirmar-senha">Confirmar Senha *</label>
              <input type="password" id="confirmar-senha" name="confirmar-senha" minlength="6"
                     placeholder="Repita a senha" autocomplete="new-password"
                     required aria-required="true" data-validate="confirmarSenha">
            </div>
          </div>
        </fieldset>

        <button type="submit" id="btn-cadastrar" class="btn-submit">Finalizar Cadastro</button>
      </form>

      <p class="auth-footer">
        Já possui cadastro? <a href="login.html">Entrar na conta</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/cadastro.js"></script>
</body>
</html>
