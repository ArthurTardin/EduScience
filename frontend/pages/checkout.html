<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - EduScience</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="chekout.css">
</head>
<body>
    <div class="container">
        <!-- Coluna da Esquerda (Formulário) -->
        <div class="card">
            <h2>Pagamento</h2>
            
            <form id="formCheckout">
                <div class="payment-methods">
                    <label class="payment-option active">
                        <input type="radio" name="metodo_pagamento" value="PIX" checked> PIX
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="metodo_pagamento" value="CARTAO"> Cartão de Crédito
                    </label>
                </div>

                <!-- Detalhes do Cartão (Só deve aparecer se o cartão for selecionado) -->
                <div id="dados-cartao" class="payment-details form-grid">
                    <div class="form-group full-width">
                        <label for="nome_cartao">Nome Impresso no Cartão</label>
                        <input type="text" id="nome_cartao" name="nome_cartao">
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="numero_cartao">Número do Cartão</label>
                        <!-- ATUALIZADO: Máscara de Cartão de Crédito -->
                        <input type="text" id="numero_cartao" name="numero_cartao" data-mascara="cartaoCredito" placeholder="0000 0000 0000 0000">
                    </div>
                    
                    <div class="form-group">
                        <label for="validade_cartao">Validade</label>
                        <input type="text" id="validade_cartao" name="validade_cartao" placeholder="MM/AA">
                    </div>
                    
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Finalizar Compra</button>
            </form>
        </div>

        <!-- Coluna da Direita (Resumo do Pedido) -->
        <div class="card">
            <h2>Resumo do Pedido</h2>
            <div id="resumo-carrinho" class="summary-totals">
                <!-- Itens injetados via JS -->
            </div>
        </div>
    </div>

    <!-- O seu script que inicializa as validações -->
    <script type="module" src="checkout.js"></script>
</body>
</html>
