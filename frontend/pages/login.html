<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EduScience</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main class="login-container">
      <h1>Login</h1>
      <p class="subtitle">Entre em sua conta</p>

      <form id="form-login">
        <div class="field">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
          />
        </div>

        <div class="field field-password">
          <label for="senha">Senha</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
              minlength="6"
            />
            <button 
              type="button" 
              id="password-toggle" 
              aria-label="Mostrar senha" 
              aria-pressed="false"
              class="btn-toggle-password"
            >Mostrar</button>
          </div>
        </div>

        <p class="forgot">
          <a href="#">Esqueci a senha</a>
        </p>

        <div id="status-message" class="status-message" aria-live="polite"></div>
        <div id="mensagem-erro" class="mensagem-erro" role="alert" hidden></div>

        <button id="submit-button" type="submit">Entrar</button>
      </form>

      <p class="signup">
        Não tem conta?
        <a href="cadastro.html">Cadastre-se</a>
      </p>
    </main>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
